name: Build & Deploy 2048 to K3s via SSH

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: haechanlovelove/game-2048

jobs:
  # ── Job 1: Build & Push Docker Image ──────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tag)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ── Job 2: Deploy ke K3s via SSH ──────────────────────────────
  deploy:
    name: Deploy to K3s via SSH
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy k8s manifests to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "k8s/"
          target: "~/workshop-k3s"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          script: |
            export KUBECONFIG=$HOME/.kube/config

            echo "==> Cek K3s service running..."
            sudo systemctl is-active k3s || (echo "K3s tidak running! Mencoba restart..." && sudo systemctl restart k3s && sleep 20)

            echo "==> Update image di manifest..."
            sed -i 's|image:.*|image: haechanlovelove/game-2048:latest|g' ~/workshop-k3s/k8s/manifest.yaml

            echo "==> Applying K8s manifests..."
            kubectl apply -f ~/workshop-k3s/k8s/manifest.yaml --validate=false

            echo "==> Force pull image terbaru..."
            kubectl rollout restart deployment/game-2048

            echo "==> Waiting for rollout..."
            kubectl rollout status deployment/game-2048 --timeout=120s

            echo "==> Status akhir:"
            kubectl get pods -l app=game-2048
            kubectl get svc game-2048-svc
